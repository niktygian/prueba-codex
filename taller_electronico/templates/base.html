<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Taller Electrónico{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <div class="layout">
        <aside class="sidebar glass">
            <h1>TallerPro</h1>
            <p class="muted">Gestión electrónica</p>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('clientes.index') }}">Clientes</a>
                <a href="{{ url_for('equipos.index') }}">Equipos</a>
                <a href="{{ url_for('ordenes.index') }}">Órdenes</a>
                <a href="{{ url_for('inventario.index') }}">Inventario</a>
            </nav>
            {% if session.get('user_id') %}
            <div class="userbox">
                <strong>{{ session.get('nombre') }}</strong>
                <span>@{{ session.get('username') }}</span>
                <a class="btn btn-ghost" href="{{ url_for('auth.logout') }}">Cerrar sesión</a>
            </div>
            {% endif %}
        </aside>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
